name: CI Frontend

on:
  push:
    branches: [main, evolucoes]
  pull_request:
    branches: [main, evolucoes]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: planeja-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: planeja-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watchAll=false

      - name: Build
        run: npm run build
